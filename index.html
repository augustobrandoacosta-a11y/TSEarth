<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Tornado Editor - EF Scale</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background-color: #05050a; color: #fff; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; z-index: 1; }

        .ui-panel {
            position: absolute; top: 20px; left: 20px; background: rgba(15, 15, 25, 0.95);
            backdrop-filter: blur(10px); border: 2px solid #6366f1; padding: 20px;
            border-radius: 12px; width: 280px; z-index: 10; box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }

        h2 { margin: 0 0 15px 0; color: #818cf8; font-size: 22px; text-align: center; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 5px; font-size: 13px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
        
        input[type="text"], select {
            width: 100%; padding: 10px; background: #1e1e2e; border: 1px solid #3f3f5f;
            color: white; border-radius: 6px; box-sizing: border-box; font-size: 14px;
        }

        .btn {
            background: #6366f1; color: white; border: none; padding: 12px;
            border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 5px;
            transition: 0.2s;
        }
        .btn:hover { background: #4f46e5; transform: translateY(-1px); }
        .btn-create { background: #059669; margin-bottom: 10px; }
        .btn-create:hover { background: #10b981; }

        .warning-text { color: #f87171; font-size: 13px; margin-bottom: 10px; text-align: center; border: 1px dashed #f87171; padding: 5px; }
        
        #status-display {
            position: absolute; bottom: 20px; right: 20px; background: rgba(0, 0, 0, 0.8);
            padding: 15px; border-radius: 8px; z-index: 10; border-left: 5px solid #ef4444;
            min-width: 200px;
        }

        .ef-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-weight: bold; background: #ef4444; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="status-display">
        <div id="active-tornado" style="font-weight: bold; font-size: 18px; margin-bottom: 5px;">Tornado: ---</div>
        <div id="active-ef" style="margin-bottom: 5px;">Rating: <span class="ef-badge" id="ef-val">None</span></div>
        <div id="active-location">City: ---</div>
    </div>

    <div class="ui-panel">
        <h2>Tornado Lab</h2>
        
        <div class="form-group">
            <label>🌪️ Storm Name</label>
            <input type="text" id="tornado-name" placeholder="E.g. The Great Vortex">
        </div>

        <div class="form-group">
            <label>⚠️ EF Intensity</label>
            <select id="ef-scale">
                <option value="1">EF1 - Weak</option>
                <option value="2">EF2 - Strong</option>
                <option value="3">EF3 - Severe</option>
                <option value="4">EF4 - Devastating</option>
                <option value="5">EF5 - Incredible</option>
                <option value="6">EF6 - Inconceivable</option>
            </select>
        </div>

        <div class="form-group">
            <label>🏙️ Target City</label>
            <div id="city-selection-zone"></div>
        </div>

        <button class="btn btn-create" onclick="createNewCity()">+ New City</button>
        <button class="btn" id="spawn-btn" onclick="spawnTornado()">GENERATE STORM</button>
    </div>

    <script>
        let cities = [];
        let currentEF = 1;
        
        // --- 3D Scene ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x05050a);
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 12, 25);
        camera.lookAt(0, 5, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0x404040));
        const light = new THREE.DirectionalLight(0xffffff, 0.5);
        light.position.set(10, 10, 10);
        scene.add(light);

        scene.add(new THREE.GridHelper(60, 30, 0x222222, 0x111111));

        // Tornado Setup
        const partCount = 800;
        const posArray = new Float32Array(partCount * 3);
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const tornadoMat = new THREE.PointsMaterial({ color: 0x888888, size: 0.15, transparent: true, opacity: 0.6 });
        const tornado = new THREE.Points(geo, tornadoMat);
        scene.add(tornado);

        // --- UI & Controls ---

        function updateCityUI() {
            const zone = document.getElementById('city-selection-zone');
            const spawnBtn = document.getElementById('spawn-btn');

            if (cities.length === 0) {
                zone.innerHTML = `<div class="warning-text">No cities, make one!</div>`;
                spawnBtn.disabled = true;
                spawnBtn.style.opacity = "0.5";
            } else {
                let options = cities.map(name => `<option value="${name}">${name}</option>`).join('');
                zone.innerHTML = `<select id="city-select">${options}</select>`;
                spawnBtn.disabled = false;
                spawnBtn.style.opacity = "1";
            }
        }

        function createNewCity() {
            const cityName = prompt("Name your city:");
            if (cityName && cityName.trim() !== "") {
                cities.push(cityName.trim());
                updateCityUI();
                addBuildings();
            }
        }

        function addBuildings() {
            const bGeo = new THREE.BoxGeometry(1.5, Math.random() * 6 + 2, 1.5);
            const bMat = new THREE.MeshLambertMaterial({ color: 0x334155 });
            const building = new THREE.Mesh(bGeo, bMat);
            building.position.set((Math.random()-0.5)*30, 0, (Math.random()-0.5)*30);
            building.position.y = bGeo.parameters.height / 2;
            scene.add(building);
        }

        function spawnTornado() {
            const tName = document.getElementById('tornado-name').value || "Unnamed Vortex";
            const cName = document.getElementById('city-select').value;
            currentEF = parseInt(document.getElementById('ef-scale').value);
            
            document.getElementById('active-tornado').innerText = "🌪️ " + tName;
            document.getElementById('ef-val').innerText = "EF" + currentEF;
            document.getElementById('active-location').innerText = "📍 City: " + cName;

            // Change tornado color based on EF (EF5/6 is darker)
            if (currentEF >= 5) tornadoMat.color.setHex(0x222222);
            else if (currentEF >= 3) tornadoMat.color.setHex(0x555555);
            else tornadoMat.color.setHex(0xaaaaaa);
        }

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.001;
            
            const positions = tornado.geometry.attributes.position.array;
            // EF scale affects speed and width
            const spinSpeed = 1 + (currentEF * 0.8);
            const widthScale = 0.5 + (currentEF * 0.2);

            for(let i=0; i<partCount; i++) {
                let y = (i / partCount) * 12; // Height
                let angle = (time * spinSpeed) + (y * 0.8);
                let radius = (y * 0.6 + 0.5) * widthScale;
                
                // Add some "wobble" for higher EF ratings
                if (currentEF > 4) radius += Math.sin(time * 5) * 0.5;

                positions[i*3] = Math.cos(angle) * radius;
                positions[i*3 + 1] = y;
                positions[i*3 + 2] = Math.sin(angle) * radius;
            }
            tornado.geometry.attributes.position.needsUpdate = true;
            renderer.render(scene, camera);
        }

        updateCityUI();
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
