<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Tornado Editor - City Builder</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background-color: #1a1a2e; color: #fff; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; z-index: 1; }

        .ui-panel {
            position: absolute; top: 20px; left: 20px; background: rgba(22, 22, 40, 0.9);
            backdrop-filter: blur(10px); border: 2px solid #4f46e5; padding: 20px;
            border-radius: 12px; width: 300px; z-index: 10; box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }

        h2 { margin-top: 0; color: #818cf8; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #cbd5e1; }
        
        input[type="text"], select {
            width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155;
            color: white; border-radius: 6px; box-sizing: border-box;
        }

        .btn {
            background: #4f46e5; color: white; border: none; padding: 10px;
            border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 5px;
        }
        .btn:hover { background: #6366f1; }
        .btn-create { background: #10b981; margin-bottom: 10px; }
        .btn-create:hover { background: #34d399; }

        .warning-text { color: #f87171; font-size: 13px; margin-bottom: 10px; font-weight: bold; }
        
        #status-display {
            position: absolute; top: 20px; right: 20px; background: rgba(22, 22, 40, 0.8);
            padding: 15px; border-radius: 8px; z-index: 10; border-right: 4px solid #4f46e5;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="status-display">
        <div id="active-tornado">Tornado: Waiting...</div>
        <div id="active-location">City: None</div>
    </div>

    <div class="ui-panel">
        <h2>Tornado Config</h2>
        
        <div class="form-group">
            <label>🌪️ Tornado Name</label>
            <input type="text" id="tornado-name" placeholder="Name your storm...">
        </div>

        <div class="form-group">
            <label>🏙️ Select Starting City</label>
            <div id="city-selection-zone">
                <!-- Dropdown or Warning loads here -->
            </div>
        </div>

        <button class="btn btn-create" onclick="createNewCity()">+ Make a New City</button>
        <button class="btn" id="spawn-btn" onclick="spawnTornado()">Spawn Tornado!</button>
    </div>

    <script>
        let cities = []; // Array of city names
        
        // --- 3D Scene Setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a12);
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 10, 20);
        camera.lookAt(0, 5, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0x404040);
        scene.add(ambientLight);
        const light = new THREE.PointLight(0x6366f1, 1, 100);
        light.position.set(0, 10, 10);
        scene.add(light);

        // Ground
        const grid = new THREE.GridHelper(50, 50, 0x444444, 0x222222);
        scene.add(grid);

        // Tornado Particles
        const partCount = 500;
        const posArray = new Float32Array(partCount * 3);
        for(let i=0; i<partCount*3; i++) posArray[i] = (Math.random()-0.5) * 10;
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const mat = new THREE.PointsMaterial({ color: 0x888888, size: 0.1 });
        const tornado = new THREE.Points(geo, mat);
        scene.add(tornado);

        // --- Logic Functions ---

        function updateCityUI() {
            const zone = document.getElementById('city-selection-zone');
            const spawnBtn = document.getElementById('spawn-btn');

            if (cities.length === 0) {
                zone.innerHTML = `<div class="warning-text">No cities, make one!</div>`;
                spawnBtn.disabled = true;
                spawnBtn.style.opacity = "0.5";
            } else {
                let options = cities.map(name => `<option value="${name}">${name}</option>`).join('');
                zone.innerHTML = `<select id="city-select">${options}</select>`;
                spawnBtn.disabled = false;
                spawnBtn.style.opacity = "1";
            }
        }

        function createNewCity() {
            const cityName = prompt("What is the name of your new city?");
            
            if (cityName && cityName.trim() !== "") {
                cities.push(cityName.trim());
                alert("City '" + cityName + "' built!");
                updateCityUI();
                addBuildingsToScene(); // Visual update
            } else if (cityName !== null) {
                alert("City name cannot be empty!");
            }
        }

        function addBuildingsToScene() {
            // Just adds a random block every time a city is made to show growth
            const bGeo = new THREE.BoxGeometry(1, Math.random() * 5 + 1, 1);
            const bMat = new THREE.MeshLambertMaterial({ color: 0x4f46e5 });
            const building = new THREE.Mesh(bGeo, bMat);
            building.position.set((Math.random()-0.5)*20, 0, (Math.random()-0.5)*20);
            building.position.y = bGeo.parameters.height / 2;
            scene.add(building);
        }

        function spawnTornado() {
            const tName = document.getElementById('tornado-name').value || "Unnamed Storm";
            const cName = document.getElementById('city-select').value;
            
            document.getElementById('active-tornado').innerText = "🌪️ Tornado: " + tName;
            document.getElementById('active-location').innerText = "📍 City: " + cName;
        }

        // Animation
        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.001;
            
            // Tornado Spin Effect
            const positions = tornado.geometry.attributes.position.array;
            for(let i=0; i<partCount; i++) {
                let y = positions[i*3 + 1];
                let angle = time * 2 + (y * 0.5);
                let radius = (y + 2) * 0.5;
                positions[i*3] = Math.cos(angle) * radius;
                positions[i*3 + 2] = Math.sin(angle) * radius;
            }
            tornado.geometry.attributes.position.needsUpdate = true;
            
            renderer.render(scene, camera);
        }

        updateCityUI();
        animate();
    </script>
</body>
</html>
