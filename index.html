<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realistic 3D Tornado Simulator</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background-color: #0b0c10; color: #fff; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; z-index: 1; }

        .ui-panel {
            position: absolute; top: 20px; left: 20px; background: rgba(10, 11, 14, 0.9);
            backdrop-filter: blur(12px); border: 1px solid #45f3ff; padding: 20px;
            border-radius: 12px; width: 280px; z-index: 10; box-shadow: 0 10px 40px rgba(0,0,0,0.9);
        }

        h2 { margin: 0 0 15px 0; color: #45f3ff; font-size: 22px; text-align: center; border-bottom: 1px solid #1f2833; padding-bottom: 10px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 5px; font-size: 12px; color: #c5a1ff; text-transform: uppercase; letter-spacing: 1px; }
        
        input[type="text"], select {
            width: 100%; padding: 10px; background: #1f2833; border: 1px solid #0b0c10;
            color: white; border-radius: 6px; box-sizing: border-box; font-size: 14px;
        }

        .btn {
            background: #45f3ff; color: #0b0c10; border: none; padding: 12px;
            border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 5px;
            transition: 0.2s; text-transform: uppercase;
        }
        .btn:hover { background: #66fcf1; transform: translateY(-1px); }
        .btn-create { background: #c5a1ff; color: #0b0c10; margin-bottom: 10px; }
        .btn-create:hover { background: #dcbfff; }

        .warning-text { color: #ff4d4d; font-size: 13px; margin-bottom: 10px; text-align: center; border: 1px dashed #ff4d4d; padding: 5px; background: rgba(255,77,77,0.1); }
        
        #status-display {
            position: absolute; bottom: 20px; right: 20px; background: rgba(11, 12, 16, 0.9);
            padding: 15px; border-radius: 8px; z-index: 10; border-left: 5px solid #45f3ff;
            min-width: 220px; box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }

        .ef-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-weight: bold; background: #45f3ff; color: #0b0c10; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="status-display">
        <div id="active-tornado" style="font-weight: bold; font-size: 18px; margin-bottom: 5px;">Tornado: ---</div>
        <div id="active-ef" style="margin-bottom: 5px;">Class: <span class="ef-badge" id="ef-val">None</span></div>
        <div id="active-location">Target: ---</div>
    </div>

    <div class="ui-panel">
        <h2>Vortex Control</h2>
        
        <div class="form-group">
            <label>🌪️ Storm Designation</label>
            <input type="text" id="tornado-name" placeholder="E.g. El Reno">
        </div>

        <div class="form-group">
            <label>⚠️ EF Severity</label>
            <select id="ef-scale">
                <option value="1">EF1 - Light Damage</option>
                <option value="2">EF2 - Considerable</option>
                <option value="3">EF3 - Severe</option>
                <option value="4">EF4 - Devastating</option>
                <option value="5">EF5 - Total Wipeout</option>
                <option value="6">EF6 - Maximum Core</option>
            </select>
        </div>

        <div class="form-group">
            <label>🏙️ Operational Zone</label>
            <div id="city-selection-zone"></div>
        </div>

        <button class="btn btn-create" onclick="createNewCity()">+ Build a City</button>
        <button class="btn" id="spawn-btn" onclick="spawnTornado()">Manifest Storm</button>
    </div>

    <script>
        let cities = [];
        let currentEF = 1;
        let particleData = [];
        
        // --- 3D Scene Setup ---
        const scene = new THREE.Scene();
        // Dark, gloomy storm sky color
        scene.background = new THREE.Color(0x0c0f12);
        scene.fog = new THREE.FogExp2(0x0c0f12, 0.03);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 8, 22);
        camera.lookAt(0, 6, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Lighting to simulate dramatic storm clouds
        const ambientLight = new THREE.AmbientLight(0x1a232a);
        scene.add(ambientLight);
        
        const lightningFlash = new THREE.DirectionalLight(0xdff0ff, 0.8);
        lightningFlash.position.set(5, 20, 5);
        scene.add(lightningFlash);

        // Ground grid
        const grid = new THREE.GridHelper(80, 40, 0x1f2833, 0x12171e);
        scene.add(grid);

        // --- Custom Cloud Texture Engine ---
        // Generates a soft, atmospheric puff instead of a solid geometric block
        function createCloudTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            
            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.3, 'rgba(200, 200, 200, 0.5)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 64, 64);
            
            const texture = new THREE.CanvasTexture(canvas);
            return texture;
        }

        // --- Realistic Volumetric Particle System ---
        const totalParticles = 600;
        const particleGeometry = new THREE.BufferGeometry();
        const positions = new Float32Array(totalParticles * 3);

        const cloudTexture = createCloudTexture();
        const tornadoMat = new THREE.PointsMaterial({
            color: 0x555c66, 
            size: 2.8,              // Large particles blending over each other makes it look like real gas/air
            map: cloudTexture,
            transparent: true,
            opacity: 0.35,          // Translucent air texture
            blending: THREE.NormalBlending,
            depthWrite: false
        });

        // Loop to configure realistic physics paths
        for (let i = 0; i < totalParticles; i++) {
            const yHeight = Math.random() * 16; 
            const angle = Math.random() * Math.PI * 2;
            const speed = 1.5 + Math.random() * 2.5;
            
            // Core formula to sculpt a realistic cone shape profile
            const radius = (Math.pow(yHeight, 1.3) * 0.25) + 0.4;

            positions[i * 3] = Math.sin(angle) * radius;
            positions[i * 3 + 1] = yHeight;
            positions[i * 3 + 2] = Math.cos(angle) * radius;

            particleData.push({
                angle: angle,
                y: yHeight,
                speed: speed,
                wobbleOffset: Math.random() * 100
            });
        }

        particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const tornadoVolume = new THREE.Points(particleGeometry, tornadoMat);
        scene.add(tornadoVolume);

        // --- UI Operations ---
        function updateCityUI() {
            const zone = document.getElementById('city-selection-zone');
            const spawnBtn = document.getElementById('spawn-btn');

            if (cities.length === 0) {
                zone.innerHTML = `<div class="warning-text">No cities, make one!</div>`;
                spawnBtn.disabled = true;
                spawnBtn.style.opacity = "0.3";
            } else {
                let options = cities.map(name => `<option value="${name}">${name}</option>`).join('');
                zone.innerHTML = `<select id="city-select">${options}</select>`;
                spawnBtn.disabled = false;
                spawnBtn.style.opacity = "1";
            }
        }

        function createNewCity() {
            const cityName = prompt("Provide City Coordinates Name:");
            if (cityName && cityName.trim() !== "") {
                cities.push(cityName.trim());
                updateCityUI();
                spawnStructuralAsset();
            }
        }

        function spawnStructuralAsset() {
            const height = Math.random() * 5 + 1.5;
            const bGeo = new THREE.BoxGeometry(1.2, height, 1.2);
            const bMat = new THREE.MeshLambertMaterial({ color: 0x1f2833 });
            const building = new THREE.Mesh(bGeo, bMat);
            
            // Randomly scatter outside the danger core
            const angle = Math.random() * Math.PI * 2;
            const range = 5 + Math.random() * 10;
            building.position.set(Math.sin(angle)*range, height/2, Math.cos(angle)*range);
            scene.add(building);
        }

        function spawnTornado() {
            const tName = document.getElementById('tornado-name').value || "F5 Spectre";
            const cName = document.getElementById('city-select').value;
            currentEF = parseInt(document.getElementById('ef-scale').value);
            
            document.getElementById('active-tornado').innerText = "🌪️ " + tName;
            document.getElementById('ef-val').innerText = "EF" + currentEF;
            document.getElementById('active-location').innerText = "📍 Target: " + cName;

            // Higher EF classes change cloud thickness and sunlight blockage
            if (currentEF >= 5) {
                tornadoMat.color.setHex(0x202429); // Dirt/debris heavy look
                tornadoMat.size = 3.8;
            } else if (currentEF >= 3) {
                tornadoMat.color.setHex(0x444b54); 
                tornadoMat.size = 3.2;
            } else {
                tornadoMat.color.setHex(0x6c7682); // Fairly light condensation funnel
                tornadoMat.size = 2.4;
            }
        }

        // --- Active Simulation Core Loop ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsed = clock.getElapsedTime();
            
            const positions = tornadoVolume.geometry.attributes.position.array;
            
            // Scaling physics parameters by selected EF class
            const rotationVelocity = 1.2 + (currentEF * 0.7);
            const expandFactor = 0.7 + (currentEF * 0.18);

            for(let i=0; i<totalParticles; i++) {
                const data = particleData[i];
                
                // Rotates the gaseous layers around the vortex track
                data.angle += (0.01 * data.speed) * rotationVelocity;
                
                // Creates a turbulent atmospheric lift
                data.y += 0.02 * data.speed;
                if(data.y > 16) data.y = 0; // Cycles vapor back to ground level

                // Base funnel shape math + dynamic wind turbulent shearing
                let radius = ((Math.pow(data.y, 1.35) * 0.22) + 0.3) * expandFactor;
                
                // Adds micro-wobbles to mimic air currents
                const windShear = Math.sin(elapsed * 4 + data.wobbleOffset) * (0.1 * currentEF);
                radius += windShear;

                positions[i*3] = Math.sin(data.angle) * radius;
                positions[i*3 + 1] = data.y;
                positions[i*3 + 2] = Math.cos(data.angle) * radius;
            }
            
            tornadoVolume.geometry.attributes.position.needsUpdate = true;
            
            // Ambient camera rotation to feel cinematic
            scene.rotation.y = elapsed * 0.03;

            renderer.render(scene, camera);
        }

        updateCityUI();
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
