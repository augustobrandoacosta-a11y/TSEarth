<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Tornado Sandbox - Interactive Edition</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background-color: #b0c4de; color: #fff; user-select: none; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; z-index: 1; }

        .ui-panel {
            position: absolute; top: 20px; left: 20px; background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(12px); border: 2px solid #e2e8f0; padding: 20px;
            border-radius: 12px; width: 280px; z-index: 10; box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        h2 { margin: 0 0 15px 0; color: #f8fafc; font-size: 22px; text-align: center; border-bottom: 2px solid #334155; padding-bottom: 10px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 5px; font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; font-weight: bold; }
        
        input[type="text"], select {
            width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155;
            color: white; border-radius: 6px; box-sizing: border-box; font-size: 14px;
        }

        .btn {
            background: #3b82f6; color: white; border: none; padding: 12px;
            border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 5px;
            transition: 0.2s; text-transform: uppercase; font-size: 13px;
        }
        .btn:hover { background: #2563eb; transform: translateY(-1px); }
        .btn-create { background: #10b981; color: white; margin-bottom: 10px; }
        .btn-create:hover { background: #059669; }
        
        .btn-stop { background: #ef4444; color: white; display: none; margin-top: 8px; }
        .btn-stop:hover { background: #dc2626; }

        .warning-text { color: #f87171; font-size: 13px; margin-bottom: 10px; text-align: center; border: 1px dashed #f87171; padding: 5px; background: rgba(248,113,113,0.1); }
        .hint-text { font-size: 12px; color: #cbd5e1; background: #334155; padding: 8px; border-radius: 6px; margin-bottom: 10px; text-align: center; }

        #status-display {
            position: absolute; bottom: 20px; right: 20px; background: rgba(15, 23, 42, 0.95);
            padding: 15px; border-radius: 8px; z-index: 10; border-left: 5px solid #3b82f6;
            min-width: 220px; box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        .ef-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-weight: bold; background: #3b82f6; color: white; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="status-display">
        <div id="active-tornado" style="font-weight: bold; font-size: 18px; margin-bottom: 5px;">Status: Calm Sky</div>
        <div id="active-ef" style="margin-bottom: 5px;">Severity: <span class="ef-badge" id="ef-val">None</span></div>
        <div id="active-location">Location: ---</div>
    </div>

    <div class="ui-panel">
        <h2>Vortex Sandbox</h2>
        
        <div class="form-group">
            <label>🏗️ Placement Tool</label>
            <div class="hint-text">Tap anywhere on the grid map to build houses manually!</div>
        </div>

        <div class="form-group">
            <label>🌪️ Storm Name</label>
            <input type="text" id="tornado-name" placeholder="Name your storm...">
        </div>

        <div class="form-group">
            <label>⚠️ EF Scale Power</label>
            <select id="ef-scale">
                <option value="1">EF1 - Light Funnel</option>
                <option value="2">EF2 - Moderate Wind</option>
                <option value="3">EF3 - Strong Vortex</option>
                <option value="4">EF4 - Severe Cloud</option>
                <option value="5">EF5 - Massive Column</option>
                <option value="6">EF6 - Doomsday Core</option>
            </select>
        </div>

        <div class="form-group">
            <label>🏙️ Target City Selection</label>
            <div id="city-selection-zone"></div>
        </div>

        <button class="btn btn-create" onclick="createNewCity()">+ Register New City</button>
        <button class="btn" id="spawn-btn" onclick="spawnTornado()">Release Tornado</button>
        <button class="btn btn-stop" id="stop-btn" onclick="stopTornado()">🚨 Emergency Stop</button>
    </div>

    <script>
        let cities = [];
        let currentEF = 1;
        let particles = [];
        let isStormActive = false;
        
        // Tornado positioning & motion tracking vectors
        let tornadoX = 0;
        let tornadoZ = 0;
        let targetX = 0;
        let targetZ = 0;
        
        const totalParticles = 400;
        
        // --- 3D Scene Setup ---
        const scene = new THREE.Scene();
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 14, 26);
        camera.lookAt(0, 2, 0);

        // Light setup for ambient daytime sky tracking
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
        directionalLight.position.set(5, 20, 5);
        scene.add(directionalLight);

        // Grid platform floor
        const gridFloor = new THREE.Mesh(
            new THREE.PlaneGeometry(100, 100),
            new THREE.MeshLambertMaterial({ color: 0x94a3b8, side: THREE.DoubleSide })
        );
        gridFloor.rotation.x = Math.PI / 2;
        scene.add(gridFloor);

        const gridHelper = new THREE.GridHelper(100, 40, 0x475569, 0x64748b);
        gridHelper.position.y = 0.01;
        scene.add(gridHelper);

        // Set initial sunny weather look
        setWeatherTheme(false);

        // --- Tornado Object Group ---
        const tornadoGroup = new THREE.Group();
        scene.add(tornadoGroup);
        tornadoGroup.visible = false; // Starts hidden!

        // Basic geometry clusters
        const cloudGeometry = new THREE.SphereGeometry(0.6, 5, 5); 
        const cloudMaterial = new THREE.MeshLambertMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: 0.6
        });

        for (let i = 0; i < totalParticles; i++) {
            const mesh = new THREE.Mesh(cloudGeometry, cloudMaterial.clone());
            const yHeight = Math.random() * 18;
            const angle = Math.random() * Math.PI * 2;
            const speed = 1.5 + Math.random() * 2.5;

            mesh.position.y = yHeight;
            tornadoGroup.add(mesh);

            particles.push({ mesh: mesh, angle: angle, y: yHeight, speed: speed });
        }

        // --- Interactive Building Placement Engine (Raycaster) ---
        const raycaster = new THREE.Raycaster();
        const mouseVector = new THREE.Vector2();

        window.addEventListener('pointerdown', (event) => {
            // Block building touches if clicking UI controls panel
            if (event.clientX < 320 && event.clientY < 550) return;

            mouseVector.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouseVector.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouseVector, camera);
