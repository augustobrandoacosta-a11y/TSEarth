<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Tornado Simulator - Bright Air Edition</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background-color: #1e2530; color: #fff; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; z-index: 1; }

        .ui-panel {
            position: absolute; top: 20px; left: 20px; background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(12px); border: 2px solid #e2e8f0; padding: 20px;
            border-radius: 12px; width: 280px; z-index: 10; box-shadow: 0 10px 40px rgba(0,0,0,0.4);
        }

        h2 { margin: 0 0 15px 0; color: #f8fafc; font-size: 22px; text-align: center; border-bottom: 2px solid #334155; padding-bottom: 10px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 5px; font-size: 12px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; font-weight: bold; }
        
        input[type="text"], select {
            width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155;
            color: white; border-radius: 6px; box-sizing: border-box; font-size: 14px;
        }

        .btn {
            background: #3b82f6; color: white; border: none; padding: 12px;
            border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 5px;
            transition: 0.2s; text-transform: uppercase;
        }
        .btn:hover { background: #2563eb; transform: translateY(-1px); }
        .btn-create { background: #10b981; color: white; margin-bottom: 10px; }
        .btn-create:hover { background: #059669; }

        .warning-text { color: #f87171; font-size: 13px; margin-bottom: 10px; text-align: center; border: 1px dashed #f87171; padding: 5px; background: rgba(248,113,113,0.1); }
        
        #status-display {
            position: absolute; bottom: 20px; right: 20px; background: rgba(15, 23, 42, 0.9);
            padding: 15px; border-radius: 8px; z-index: 10; border-left: 5px solid #3b82f6;
            min-width: 220px; box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        .ef-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-weight: bold; background: #3b82f6; color: white; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="status-display">
        <div id="active-tornado" style="font-weight: bold; font-size: 18px; margin-bottom: 5px;">Tornado: ---</div>
        <div id="active-ef" style="margin-bottom: 5px;">Severity: <span class="ef-badge" id="ef-val">None</span></div>
        <div id="active-location">Target: ---</div>
    </div>

    <div class="ui-panel">
        <h2>Vortex Lab</h2>
        
        <div class="form-group">
            <label>🌪️ Storm Name</label>
            <input type="text" id="tornado-name" placeholder="Name your storm...">
        </div>

        <div class="form-group">
            <label>⚠️ EF Scale</label>
            <select id="ef-scale">
                <option value="1">EF1 - Light Funnel</option>
                <option value="2">EF2 - Moderate Wind</option>
                <option value="3">EF3 - Strong Vortex</option>
                <option value="4">EF4 - Severe Cloud</option>
                <option value="5">EF5 - Massive Air Column</option>
                <option value="6">EF6 - Maximum Core Power</option>
            </select>
        </div>

        <div class="form-group">
            <label>🏙️ Target Settlement</label>
            <div id="city-selection-zone"></div>
        </div>

        <button class="btn btn-create" onclick="createNewCity()">+ Build a City</button>
        <button class="btn" id="spawn-btn" onclick="spawnTornado()">Release Tornado</button>
    </div>

    <script>
        let cities = [];
        let currentEF = 1;
        let particleData = [];
        
        // --- 3D Scene Setup ---
        const scene = new THREE.Scene();
        // A lighter, overcast sky blue/gray background instead of pitching black dark
        scene.background = new THREE.Color(0xb0c4de);
        scene.fog = new THREE.FogExp2(0xb0c4de, 0.025);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 8, 22);
        camera.lookAt(0, 6, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Bright, even scene lighting to keep everything clean and clear
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
        directionalLight.position.set(5, 15, 5);
        scene.add(directionalLight);

        // Ground grid
        const grid = new THREE.GridHelper(80, 40, 0x94a3b8, 0xcbd5e1);
        scene.add(grid);

        // Custom Soft Air/Cloud Texture Generator
        function createCloudTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
